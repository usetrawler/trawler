name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @usetrawler/control-plane
      - name: control plane answers on /healthz
        run: |
          PORT=3000 node apps/control-plane/.next/standalone/apps/control-plane/server.js &
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && exit 0; sleep 1; done
          exit 1
