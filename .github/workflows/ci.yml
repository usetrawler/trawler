name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run db:up
      - run: npm run db:migrate
      - run: npm run db:validate
      - run: npm run db:codegen && git diff --exit-code apps/control-plane/src/db/types.ts
      - run: npm test
      - run: npm run build -w @usetrawler/control-plane
      - name: control plane answers on /healthz
        run: |
          HOSTNAME=0.0.0.0 PORT=3000 node apps/control-plane/.next/standalone/apps/control-plane/server.js &
          trap 'kill %1' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3000/healthz && break; sleep 1; done
          curl -sf localhost:3000/healthz
          css=$(curl -sf localhost:3000/ | grep -o '/_next/static/[^"]*\.css' | head -1)
          test -n "$css" && curl -sf "localhost:3000$css" > /dev/null
